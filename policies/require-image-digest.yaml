# Every container image is pinned by digest.
#
# Runs in CI first (`kyverno apply`, BUILD-PLAN Phase 3) and at admission from
# Phase 7. Whether the digest is the manifest-list INDEX, never a per-arch
# manifest, cannot be decided from the YAML alone: bo-deploy's `validate` check
# asks the registry.
#
# ValidatingPolicy, not ClusterPolicy: Kyverno 1.19 deprecated ClusterPolicy and
# 1.20 removes it (DECISIONS.md 2026-09-30).
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-image-digest
  annotations:
    policies.kyverno.io/title: Images are pinned by digest
    policies.kyverno.io/description: >-
      A tag can move; a digest cannot. Every container, init container and
      ephemeral container image must end in @sha256:<64 hex>.
spec:
  validationActions: [Deny]
  # Pod controllers are listed explicitly rather than autogenerated, so what
  # the policy covers is visible here. Phase 6 adds argoproj.io rollouts.
  matchConstraints:
    resourceRules:
      - { apiGroups: [""], apiVersions: [v1], operations: [CREATE, UPDATE], resources: [pods] }
      - { apiGroups: [apps], apiVersions: [v1], operations: [CREATE, UPDATE], resources: [deployments, replicasets, statefulsets, daemonsets] }
      - { apiGroups: [batch], apiVersions: [v1], operations: [CREATE, UPDATE], resources: [jobs, cronjobs] }
  variables:
    - name: podSpec
      expression: >-
        object.kind == 'Pod' ? object.spec :
        (object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.spec : object.spec.template.spec)
    - name: images
      expression: >-
        variables.podSpec.containers.map(c, c.image) +
        (has(variables.podSpec.initContainers) ? variables.podSpec.initContainers.map(c, c.image) : []) +
        (has(variables.podSpec.ephemeralContainers) ? variables.podSpec.ephemeralContainers.map(c, c.image) : [])
    - name: unpinned
      expression: variables.images.filter(i, !i.matches('@sha256:[0-9a-f]{64}$'))
  validations:
    - expression: size(variables.unpinned) == 0
      messageExpression: >-
        'images must be pinned by digest (@sha256:<64 hex>), not by tag: ' + variables.unpinned.join(', ')
