# The root of the app-of-apps. Applied once by scripts/bootstrap.sh; from then
# on, every ApplicationSet and Application under argocd/ is delivered from git.
#
# Excludes itself: the root app is bootstrap's one kubectl apply, and letting it
# also manage itself would mean a bad edit here could prune the whole tree.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/bo-jr/bo-platform.git
    targetRevision: main
    path: argocd
    directory:
      recurse: true
      exclude: root-app.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
