# Platform chart versions for the DEV spoke — version authority #3 (DECISIONS.md).
#
# Versions land here FIRST. They reach prod only through a second PR against
# platform/prod/versions.yaml. Promotion is a diff, never a copy of a whole file.
#
# Each list element becomes one Argo CD Application on dev, generated by
# argocd/appsets/platform.yaml. Image digests live in values/<component>.yaml
# beside this file and must move in the SAME PR as the chart version.
- component: cert-manager
  repoURL: https://charts.jetstack.io
  chart: cert-manager
  version: v1.21.2
  namespace: cert-manager
  wave: "0"
# CloudNativePG operator (Phase 2). Its CRDs ship inside this same chart and
# Application, so no cross-Application ordering is needed. The catalog `Cluster`
# lives in databases/<env>/, not here. See DECISIONS.md 2026-09-29.
- component: cloudnative-pg
  repoURL: https://cloudnative-pg.github.io/charts
  chart: cloudnative-pg
  version: 0.29.1
  namespace: cnpg-system
  wave: "2"
