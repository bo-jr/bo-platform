version: '3'

silent: true

# ---------------------------------------------------------------------------
# Version authority #4: cluster infrastructure images.
#
# The other three live elsewhere by design — host tools in
# scripts/bootstrap-toolchain.sh, platform chart versions in
# platform/<env>/versions.yaml (Phase 1), service image digests in
# bo-deploy/rendered/<env>/ (Phase 3). These two belong to neither, so they
# live here: the three cluster configs cannot share a variable between them,
# and reading a YAML file would need yq, which is not in the pin list.
#
# Pinned by manifest-list (index) digest, never tag. A per-arch digest would
# pull on this MacBook and fail `no match for platform` on the WSL2 box.
# ---------------------------------------------------------------------------
vars:
  NETWORK: gitops-lab

  # rancher/k3s v1.36.4-k3s1 — linux/amd64 + linux/arm64
  # Held at 1.36.x: Helm 4.2 supports n-3 (1.36 down to 1.33) and Argo CD >=3.5
  # renders only with Helm 4. See DECISIONS.md 2026-09-05.
  K3S_IMAGE: docker.io/rancher/k3s@sha256:edad48e12bf81c3a09ac1c05c0c0ffaaa22145980b989d6fae84543a76b83657

  # library/registry 2.8.3 — linux/amd64 + linux/arm64
  # k3d's default is the floating tag `registry:2`; this is that exact image,
  # pinned. Same digest, no floating reference.
  REGISTRY_IMAGE: docker.io/library/registry@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373

  # Host port for the push registry. NOT 5000: macOS Control Center (AirPlay
  # Receiver) already listens there. Only the host-side port moves — inside the
  # network it is k3d-registry:5000, which is what manifests and mirrors use.
  PUSH_PORT: '5005'

  CLUSTERS: mgmt dev prod

tasks:

  default:
    desc: List available tasks
    cmds:
      - task --list

  # -------------------------------------------------------------------------
  # Lifecycle
  # -------------------------------------------------------------------------

  up:
    desc: "Bring the lab up: network -> caches -> push registry -> three clusters"
    cmds:
      - task: net
      - task: caches
      - task: registry
      - task: clusters
      - task: status
      - echo ""
      - echo "Phase 1 adds Argo CD and the root app to this target."

  down:
    desc: "Delete all three clusters. KEEPS the push registry and the caches."
    cmds:
      - |
        # k3d exits 0 whether or not anything was deleted, so test first —
        # otherwise this reports success on a lab that was never up.
        existing=$(k3d cluster list -o json 2>/dev/null | jq -r '.[].name')
        for c in {{.CLUSTERS}}; do
          if echo "$existing" | grep -qx "$c"; then
            k3d cluster delete "$c" >/dev/null 2>&1 && echo "deleted cluster $c"
          else
            echo "cluster $c not present"
          fi
        done
      - echo "registries kept — 'task nuke' also drops the push registry"

  nuke:
    desc: "Delete clusters AND the push registry. KEEPS the pull-through caches."
    cmds:
      - task: down
      - |
        if k3d registry list -o json 2>/dev/null | jq -r '.[].name' | grep -qx 'k3d-registry'; then
          k3d registry delete k3d-registry >/dev/null 2>&1 && echo "deleted push registry"
        else
          echo "push registry not present"
        fi
      - |
        echo ""
        echo "Pull-through caches kept on purpose: they hold no state you authored,"
        echo "only upstream images, and refilling them is the expensive part."
        echo "To drop them too: task caches:destroy"

  pause:
    desc: "Stop the clusters without deleting them. Preserves all data."
    cmds:
      - |
        existing=$(k3d cluster list -o json 2>/dev/null | jq -r '.[].name')
        for c in {{.CLUSTERS}}; do
          if echo "$existing" | grep -qx "$c"; then
            k3d cluster stop "$c" >/dev/null 2>&1 && echo "stopped $c"
          else
            echo "cluster $c not present"
          fi
        done

  resume:
    desc: "Start previously paused clusters."
    cmds:
      - |
        existing=$(k3d cluster list -o json 2>/dev/null | jq -r '.[].name')
        for c in {{.CLUSTERS}}; do
          if echo "$existing" | grep -qx "$c"; then
            k3d cluster start "$c" >/dev/null 2>&1 && echo "started $c"
          else
            echo "cluster $c not present"
          fi
        done

  status:
    desc: "What exists right now — network, registries, clusters, contexts."
    cmds:
      - |
        echo "network:"
        docker network inspect {{.NETWORK}} >/dev/null 2>&1 \
          && echo "  {{.NETWORK}} present" || echo "  {{.NETWORK}} ABSENT"
        echo ""
        echo "registries:"
        k3d registry list 2>/dev/null || true
        echo ""
        echo "clusters:"
        k3d cluster list 2>/dev/null || true

  # -------------------------------------------------------------------------
  # Pieces of `up` — internal, but individually runnable when something breaks
  # -------------------------------------------------------------------------

  net:
    desc: "Create the shared Docker network (idempotent)."
    cmds:
      - |
        if docker network inspect {{.NETWORK}} >/dev/null 2>&1; then
          echo "network {{.NETWORK}} already present"
        else
          docker network create {{.NETWORK}} >/dev/null
          echo "created network {{.NETWORK}}"
        fi

  registry:
    desc: "Create the push registry for locally-built images (idempotent)."
    deps: [net]
    cmds:
      - |
        if k3d registry list 2>/dev/null | grep -q '^k3d-registry '; then
          echo "push registry already present"
        else
          k3d registry create registry \
            --port {{.PUSH_PORT}} \
            --default-network {{.NETWORK}} \
            --image {{.REGISTRY_IMAGE}} >/dev/null
          echo "created push registry  host=localhost:{{.PUSH_PORT}}  in-cluster=k3d-registry:5000"
        fi

  caches:
    desc: "Create the four pull-through caches (idempotent). Survive nuke."
    deps: [net]
    preconditions:
      - sh: ./scripts/get-secret.sh --check "dockerhub-user dockerhub-token"
        msg: |
          Docker Hub credentials are not in the vault.
          Without them the cache still works but authenticates as anonymous, which
          is the rate limit we are trying to escape. Fill them in 1Password, then
          re-run. See SETUP.md section 5.
    cmds:
      - |
        set -eu
        DH_USER=$(./scripts/get-secret.sh dockerhub-user)
        DH_TOKEN=$(./scripts/get-secret.sh dockerhub-token)

        have() { k3d registry list 2>/dev/null | grep -q "^k3d-$1 "; }

        # Registry proxy mode is single-upstream, hence one container per registry.
        mk() { # name port upstream [user token]
          if have "$1"; then echo "cache $1 already present"; return; fi
          if [ $# -gt 3 ]; then
            k3d registry create "$1" --port "$2" --default-network {{.NETWORK}} \
              --image {{.REGISTRY_IMAGE}} --proxy-remote-url "$3" \
              --proxy-username "$4" --proxy-password "$5" >/dev/null
          else
            k3d registry create "$1" --port "$2" --default-network {{.NETWORK}} \
              --image {{.REGISTRY_IMAGE}} --proxy-remote-url "$3" >/dev/null
          fi
          echo "created cache $1 -> $3"
        }

        mk dockerhub 5001 https://registry-1.docker.io "$DH_USER" "$DH_TOKEN"
        mk quay      5002 https://quay.io
        mk ghcr      5003 https://ghcr.io
        mk k8s       5004 https://registry.k8s.io

  caches:destroy:
    desc: "Drop the pull-through caches. Rarely wanted — refilling them is slow."
    cmds:
      - |
        existing=$(k3d registry list -o json 2>/dev/null | jq -r '.[].name')
        for r in dockerhub quay ghcr k8s; do
          if echo "$existing" | grep -qx "k3d-$r"; then
            k3d registry delete "k3d-$r" >/dev/null 2>&1 && echo "deleted cache $r"
          else
            echo "cache $r not present"
          fi
        done

  clusters:
    desc: "Create the three clusters from clusters/*.yaml (idempotent)."
    deps: [net]
    cmds:
      - |
        set -eu
        for c in {{.CLUSTERS}}; do
          if k3d cluster list 2>/dev/null | grep -q "^$c "; then
            echo "cluster $c already present"
            continue
          fi
          k3d cluster create \
            --config "clusters/$c.yaml" \
            --image {{.K3S_IMAGE}} \
            --registry-config clusters/registries.yaml \
            --registry-use "k3d-registry:{{.PUSH_PORT}}"
          echo "created cluster $c"
        done

  # -------------------------------------------------------------------------
  # GitHub
  # -------------------------------------------------------------------------

  repos:protect:
    desc: "Apply the same branch-protection ruleset to all seven repos."
    vars:
      REPOS: bo-platform bo-deploy bo-service-chart bo-service-kit bo-storefront bo-catalog bo-pricing
      # Number of approving reviews required on main.
      #
      # READ BEFORE CHANGING. bo-jr is the only collaborator on these repos, and
      # GitHub does not let you approve your own pull request. Setting this to 1
      # makes every PR permanently unmergeable except by an admin bypass — which
      # turns the prod gate into decoration, the exact failure BUILD-PLAN warns
      # about for private repos. At 0 the gate is still real: a PR is required,
      # force-push and deletion are blocked, and required status checks must pass
      # before merge. Raise this the day a second human can approve.
      REVIEWS: '0'
    cmds:
      - |
        set -eu
        for r in {{.REPOS}}; do
          printf '%-18s ' "$r"
          gh api -X POST "repos/bo-jr/$r/rulesets" \
            -H "Accept: application/vnd.github+json" \
            -f name='main-protection' \
            -f target='branch' \
            -f enforcement='active' \
            -F 'conditions[ref_name][include][]=~DEFAULT_BRANCH' \
            -F 'rules[][type]=deletion' \
            -F 'rules[][type]=non_fast_forward' \
            -F 'rules[][type]=pull_request' \
            -F 'rules[][parameters][required_approving_review_count]={{.REVIEWS}}' \
            -F 'rules[][parameters][dismiss_stale_reviews_on_push]=true' \
            -F 'rules[][parameters][require_code_owner_review]=false' \
            -F 'rules[][parameters][require_last_push_approval]=false' \
            -F 'rules[][parameters][required_review_thread_resolution]=false' \
            --jq '"ruleset \(.id) applied"' 2>&1 | tail -1
        done

  repos:protect:show:
    desc: "Print the current ruleset on each repo without changing anything."
    cmds:
      - |
        for r in bo-platform bo-deploy bo-service-chart bo-service-kit bo-storefront bo-catalog bo-pricing; do
          n=$(gh api "repos/bo-jr/$r/rulesets" --jq 'length' 2>/dev/null || echo '?')
          printf '%-18s rulesets=%s\n' "$r" "$n"
        done
