version: '3'

silent: true

# ---------------------------------------------------------------------------
# Version authority #4: cluster infrastructure images.
#
# The other three live elsewhere by design — host tools in
# scripts/bootstrap-toolchain.sh, platform chart versions in
# platform/<env>/versions.yaml (Phase 1), service image digests in
# bo-deploy/rendered/<env>/ (Phase 3). These two belong to neither, so they
# live here: the three cluster configs cannot share a variable between them,
# and reading a YAML file would need yq, which is not in the pin list.
#
# Pinned by manifest-list (index) digest, never tag. A per-arch digest would pull
# here on arm64 and fail `no match for platform` on the amd64 GitHub Actions
# runners that build and scan these images.
# ---------------------------------------------------------------------------
vars:
  NETWORK: gitops-lab

  # rancher/k3s v1.36.4-k3s1 — linux/amd64 + linux/arm64
  # Held at 1.36.x: Helm 4.2 supports n-3 (1.36 down to 1.33) and Argo CD >=3.5
  # renders only with Helm 4. See DECISIONS.md 2026-09-05.
  K3S_IMAGE: docker.io/rancher/k3s@sha256:edad48e12bf81c3a09ac1c05c0c0ffaaa22145980b989d6fae84543a76b83657

  # library/registry 2.8.3 — linux/amd64 + linux/arm64
  # k3d's default is the floating tag `registry:2`; this is that exact image,
  # pinned. Same digest, no floating reference.
  REGISTRY_IMAGE: docker.io/library/registry@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373

  # Host port for the push registry. NOT 5000: macOS Control Center (AirPlay
  # Receiver) already listens there. Only the host-side port moves — inside the
  # network it is k3d-registry:5000, which is what manifests and mirrors use.
  PUSH_PORT: '5005'

  # moby/buildkit v0.33.0 — linux/amd64 + linux/arm64. The local image builder
  # (`task builder`). Docker Desktop here runs the classic image store, whose
  # `docker` build driver cannot produce a multi-platform image; see
  # DECISIONS.md 2026-09-29. Host-side only — no cluster runs it.
  BUILDKIT_IMAGE: docker.io/moby/buildkit@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3
  BUILDER: gitops-lab

  CLUSTERS: mgmt dev prod

  # Phase 2 sandbox loop. Service repos are cloned side by side under ~/git.
  SERVICES: storefront catalog pricing
  SERVICE_CHART: oci://ghcr.io/bo-jr/charts/service

tasks:

  default:
    desc: List available tasks
    cmds:
      - task --list

  # -------------------------------------------------------------------------
  # Lifecycle
  # -------------------------------------------------------------------------

  up:
    desc: "Bring the lab up: network -> caches -> registry -> clusters -> Argo CD -> spokes"
    cmds:
      - task: net
      - task: caches
      - task: registry
      - task: clusters
      - task: bootstrap
      - task: register
      - task: status

  down:
    desc: "Delete all three clusters. KEEPS the push registry and the caches."
    cmds:
      - |
        # k3d exits 0 whether or not anything was deleted, so test first —
        # otherwise this reports success on a lab that was never up.
        existing=$(k3d cluster list -o json 2>/dev/null | jq -r '.[].name')
        for c in {{.CLUSTERS}}; do
          if echo "$existing" | grep -qx "$c"; then
            k3d cluster delete "$c" >/dev/null 2>&1 && echo "deleted cluster $c"
          else
            echo "cluster $c not present"
          fi
        done
      - echo "registries kept — 'task nuke' also drops the push registry"

  nuke:
    desc: "Delete clusters AND the push registry. KEEPS the pull-through caches."
    cmds:
      - task: down
      - |
        if k3d registry list -o json 2>/dev/null | jq -r '.[].name' | grep -qx 'k3d-registry'; then
          k3d registry delete k3d-registry >/dev/null 2>&1 && echo "deleted push registry"
        else
          echo "push registry not present"
        fi
      - |
        echo ""
        echo "Pull-through caches kept on purpose: they hold no state you authored,"
        echo "only upstream images, and refilling them is the expensive part."
        echo "To drop them too: task caches:destroy"

  pause:
    desc: "Stop the clusters without deleting them. Preserves all data."
    cmds:
      - |
        existing=$(k3d cluster list -o json 2>/dev/null | jq -r '.[].name')
        for c in {{.CLUSTERS}}; do
          if echo "$existing" | grep -qx "$c"; then
            k3d cluster stop "$c" >/dev/null 2>&1 && echo "stopped $c"
          else
            echo "cluster $c not present"
          fi
        done

  resume:
    desc: "Start previously paused clusters."
    cmds:
      - |
        existing=$(k3d cluster list -o json 2>/dev/null | jq -r '.[].name')
        for c in {{.CLUSTERS}}; do
          if echo "$existing" | grep -qx "$c"; then
            k3d cluster start "$c" >/dev/null 2>&1 && echo "started $c"
          else
            echo "cluster $c not present"
          fi
        done

  status:
    desc: "What exists right now — network, registries, clusters, contexts."
    cmds:
      - |
        echo "network:"
        docker network inspect {{.NETWORK}} >/dev/null 2>&1 \
          && echo "  {{.NETWORK}} present" || echo "  {{.NETWORK}} ABSENT"
        echo ""
        echo "registries:"
        k3d registry list 2>/dev/null || true
        echo ""
        echo "clusters:"
        k3d cluster list 2>/dev/null || true

  pods:
    desc: "Every pod in all three clusters, all namespaces."
    cmds:
      - |
        for c in {{.CLUSTERS}}; do
          echo "=== $c ==="
          kubectl --context "k3d-$c" get pods -A --no-headers 2>/dev/null \
            | awk '{printf "  %-16s %-46s %-8s %s\n", $1, $2, $4, $3}' \
            || echo "  (cluster not reachable)"
        done

  ui:
    desc: "Argo CD UI — prints the admin password and port-forwards on :8080."
    cmds:
      - |
        echo "url:      http://localhost:8080"
        echo "user:     admin"
        printf 'password: '
        kubectl --context k3d-mgmt -n argocd get secret argocd-initial-admin-secret \
          -o jsonpath='{.data.password}' 2>/dev/null | base64 -d; echo
        echo ""
        echo "Ctrl-C to stop the port-forward."
        kubectl --context k3d-mgmt -n argocd port-forward svc/argocd-server 8080:80

  # -------------------------------------------------------------------------
  # Pieces of `up` — internal, but individually runnable when something breaks
  # -------------------------------------------------------------------------

  net:
    desc: "Create the shared Docker network (idempotent)."
    cmds:
      - |
        if docker network inspect {{.NETWORK}} >/dev/null 2>&1; then
          echo "network {{.NETWORK}} already present"
        else
          docker network create {{.NETWORK}} >/dev/null
          echo "created network {{.NETWORK}}"
        fi

  registry:
    desc: "Create the push registry for locally-built images (idempotent)."
    deps: [net]
    cmds:
      - |
        if k3d registry list 2>/dev/null | grep -q '^k3d-registry '; then
          echo "push registry already present"
        else
          k3d registry create registry \
            --port {{.PUSH_PORT}} \
            --default-network {{.NETWORK}} \
            --image {{.REGISTRY_IMAGE}} >/dev/null
          echo "created push registry  host=localhost:{{.PUSH_PORT}}  in-cluster=k3d-registry:5000"
        fi

  caches:
    desc: "Create the four pull-through caches (idempotent). Survive nuke."
    deps: [net]
    preconditions:
      - sh: ./scripts/get-secret.sh --check "dockerhub-user dockerhub-token"
        msg: |
          Docker Hub credentials are not in the vault.
          Without them the cache still works but authenticates as anonymous, which
          is the rate limit we are trying to escape. Fill them in 1Password, then
          re-run. See SETUP.md section 5.
    cmds:
      - |
        set -eu
        DH_USER=$(./scripts/get-secret.sh dockerhub-user)
        DH_TOKEN=$(./scripts/get-secret.sh dockerhub-token)

        have() { k3d registry list 2>/dev/null | grep -q "^k3d-$1 "; }

        # Registry proxy mode is single-upstream, hence one container per registry.
        mk() { # name port upstream [user token]
          if have "$1"; then echo "cache $1 already present"; return; fi
          if [ $# -gt 3 ]; then
            k3d registry create "$1" --port "$2" --default-network {{.NETWORK}} \
              --image {{.REGISTRY_IMAGE}} --proxy-remote-url "$3" \
              --proxy-username "$4" --proxy-password "$5" >/dev/null
          else
            k3d registry create "$1" --port "$2" --default-network {{.NETWORK}} \
              --image {{.REGISTRY_IMAGE}} --proxy-remote-url "$3" >/dev/null
          fi
          echo "created cache $1 -> $3"
        }

        mk dockerhub 5001 https://registry-1.docker.io "$DH_USER" "$DH_TOKEN"
        mk quay      5002 https://quay.io
        mk ghcr      5003 https://ghcr.io
        mk k8s       5004 https://registry.k8s.io

  caches:destroy:
    desc: "Drop the pull-through caches. Rarely wanted — refilling them is slow."
    cmds:
      - |
        existing=$(k3d registry list -o json 2>/dev/null | jq -r '.[].name')
        for r in dockerhub quay ghcr k8s; do
          if echo "$existing" | grep -qx "k3d-$r"; then
            k3d registry delete "k3d-$r" >/dev/null 2>&1 && echo "deleted cache $r"
          else
            echo "cache $r not present"
          fi
        done

  clusters:
    desc: "Create the three clusters from clusters/*.yaml (idempotent)."
    deps: [net]
    cmds:
      - |
        set -eu
        for c in {{.CLUSTERS}}; do
          if k3d cluster list 2>/dev/null | grep -q "^$c "; then
            echo "cluster $c already present"
            continue
          fi
          k3d cluster create \
            --config "clusters/$c.yaml" \
            --image {{.K3S_IMAGE}} \
            --registry-config clusters/registries.yaml \
            --registry-use "k3d-registry:{{.PUSH_PORT}}"
          echo "created cluster $c"
        done

  bootstrap:
    desc: "Install Argo CD in mgmt and apply the root app — the only non-GitOps install."
    deps: [lint]
    cmds:
      - ./scripts/bootstrap.sh

  register:
    desc: "Register dev and prod with Argo CD (idempotent). No credentials touch git."
    cmds:
      - ./scripts/register-spokes.sh

  lint:
    desc: "Assert bootstrap.sh installs only Argo CD and applies only the root app."
    cmds:
      - ./scripts/lint-bootstrap.sh

  # -------------------------------------------------------------------------
  # Services: local builds and the `sandbox` inner loop (Phase 2)
  #
  # `sandbox` is a namespace in dev that NO Argo CD Application manages. It is
  # where iteration happens; nothing in it is a source of truth or is promoted.
  # From Phase 3, services reach dev through bo-deploy instead.
  # -------------------------------------------------------------------------

  builder:
    desc: "Create the pinned BuildKit builder for multi-arch images (idempotent)."
    deps: [net]
    cmds:
      - |
        if docker buildx inspect {{.BUILDER}} >/dev/null 2>&1; then
          echo "builder {{.BUILDER}} already present"
        else
          # On the lab network, so it pushes to k3d-registry:5000 by the same
          # name the clusters pull from. Never made the default builder: every
          # build here names it explicitly.
          docker buildx create --name {{.BUILDER}} --driver docker-container \
            --driver-opt image={{.BUILDKIT_IMAGE}} \
            --driver-opt network={{.NETWORK}} \
            --buildkitd-config clusters/buildkitd.toml \
            --bootstrap >/dev/null
          echo "created builder {{.BUILDER}} on network {{.NETWORK}}"
        fi

  sandbox:
    desc: "Create the unmanaged `sandbox` namespace in dev (idempotent)."
    cmds:
      - |
        set -eu
        # The one property that makes sandbox safe to iterate in.
        n=$(kubectl --context k3d-mgmt -n argocd get applications -o json \
          | jq '[.items[] | select(.spec.destination.namespace == "sandbox")] | length')
        if [ "$n" != 0 ]; then
          echo "refusing: $n Argo CD Application(s) target namespace sandbox" >&2
          exit 1
        fi
        kubectl --context k3d-dev apply -f - >/dev/null <<'YAML'
        apiVersion: v1
        kind: Namespace
        metadata:
          name: sandbox
          labels:
            gitops-lab/unmanaged: "true"
        YAML
        echo "namespace sandbox ready in dev — no Argo CD Application targets it"

  sandbox:db:
    desc: "Apply catalog's Postgres Cluster to sandbox and wait until it is Ready."
    deps: [sandbox]
    cmds:
      - kubectl --context k3d-dev -n sandbox apply -f databases/dev/catalog.yaml
      - kubectl --context k3d-dev -n sandbox wait cluster.postgresql.cnpg.io/catalog-db --for=condition=Ready --timeout=300s

  sandbox:build:
    desc: "Build a service for amd64+arm64 and push it by digest. Usage: task sandbox:build -- <service>"
    deps: [builder]
    cmds:
      - |
        set -eu
        svc="{{.CLI_ARGS}}"
        case " {{.SERVICES}} " in *" $svc "*) ;; *) echo "usage: task sandbox:build -- <{{.SERVICES}}>" >&2; exit 1 ;; esac
        mkdir -p .sandbox
        # push-by-digest: no tag is created in the registry at all. The index
        # digest BuildKit reports is the only handle, and the only thing the
        # rendered manifest will reference.
        docker buildx build --builder {{.BUILDER}} \
          --platform linux/amd64,linux/arm64 \
          --output "type=image,name=k3d-registry:5000/bo-$svc,push-by-digest=true,name-canonical=true,push=true" \
          --metadata-file ".sandbox/$svc.build.json" \
          "$HOME/git/bo-$svc"
        jq -r '."containerimage.digest"' ".sandbox/$svc.build.json" > ".sandbox/$svc.digest"
        echo "pushed k3d-registry:5000/bo-$svc@$(cat ".sandbox/$svc.digest")"

  sandbox:deploy:
    desc: "Render a service with the pinned shared chart and apply it to sandbox. Usage: task sandbox:deploy -- <service> [helm args]"
    deps: [sandbox]
    cmds:
      - |
        set -eu
        set -- {{.CLI_ARGS}}
        svc=${1:-}; shift || true
        case " {{.SERVICES}} " in *" $svc "*) ;; *) echo "usage: task sandbox:deploy -- <{{.SERVICES}}> [helm args]" >&2; exit 1 ;; esac
        values="$HOME/git/bo-$svc/chart-values.yaml"
        [ -f ".sandbox/$svc.digest" ] || { echo "no build yet: task sandbox:build -- $svc" >&2; exit 1; }
        # The service repo pins the chart; this reads the pin rather than
        # choosing a version. The chart refuses to render on a mismatch.
        ver=$(awk '/^chartVersion:/ { print $2; exit }' "$values")
        # Pull first, render the local archive. Helm 4 prints "Pulled:" and
        # "Digest:" on STDOUT when `helm template` fetches an OCI chart itself,
        # and has no flag to silence it; those lines would be the first YAML
        # document in the manifest stream. See DECISIONS.md 2026-09-29.
        chart=$(mktemp -d); trap 'rm -rf "$chart"' EXIT
        helm pull {{.SERVICE_CHART}} --version "$ver" -d "$chart" >/dev/null
        # Extra args override chart-values, e.g. --set-string env.FAILURE_RATE=0.5
        helm template "$svc" "$chart"/*.tgz -f "$values" \
          --set image.repository="k3d-registry:5000/bo-$svc" \
          --set image.digest="$(cat ".sandbox/$svc.digest")" "$@" \
          | kubectl --context k3d-dev -n sandbox apply --server-side --field-manager=sandbox -f -
        kubectl --context k3d-dev -n sandbox rollout status "deploy/$svc" --timeout=180s

  sandbox:down:
    desc: "Delete the sandbox namespace, including catalog's database."
    cmds:
      - kubectl --context k3d-dev delete namespace sandbox --ignore-not-found

  # -------------------------------------------------------------------------
  # GitHub
  # -------------------------------------------------------------------------

  repos:protect:
    desc: "Apply the same branch-protection ruleset to all seven repos (idempotent)."
    vars:
      REPOS: bo-platform bo-deploy bo-service-chart bo-service-kit bo-storefront bo-catalog bo-pricing
      # Approving reviews required on main.
      #
      # READ BEFORE CHANGING. bo-jr is the only collaborator, and GitHub does not
      # let you approve your own pull request. At 1 every PR becomes unmergeable
      # except by admin bypass — and a gate whose only path is a bypass is
      # decoration, the exact failure BUILD-PLAN rejects for private repos. At 0
      # the gate is still real: a PR is required, force-push and deletion are
      # blocked, stale reviews are dismissed, and required status checks must
      # pass. Raise this when a second identity can approve — most likely when
      # cmd/promoter opens prod PRs under its own token (Phase 3).
      REVIEWS: '0'
    cmds:
      - |
        set -eu
        payload=$(mktemp); trap 'rm -f "$payload"' EXIT
        cat > "$payload" <<JSON
        {
          "name": "main-protection",
          "target": "branch",
          "enforcement": "active",
          "conditions": { "ref_name": { "include": ["~DEFAULT_BRANCH"], "exclude": [] } },
          "rules": [
            { "type": "deletion" },
            { "type": "non_fast_forward" },
            { "type": "pull_request",
              "parameters": {
                "required_approving_review_count": {{.REVIEWS}},
                "dismiss_stale_reviews_on_push": true,
                "require_code_owner_review": false,
                "require_last_push_approval": false,
                "required_review_thread_resolution": false,
                "automatic_copilot_code_review_enabled": false,
                "allowed_merge_methods": ["squash", "merge", "rebase"]
              }
            }
          ]
        }
        JSON

        for r in {{.REPOS}}; do
          printf '%-18s ' "$r"
          # Update in place if it already exists — a bare POST would stack a
          # second identical ruleset on every run.
          id=$(gh api "repos/bo-jr/$r/rulesets" --jq '.[] | select(.name=="main-protection") | .id' 2>/dev/null | head -1)
          if [ -n "$id" ]; then
            gh api -X PUT "repos/bo-jr/$r/rulesets/$id" --input "$payload" \
              --jq '"updated ruleset \(.id)"' 2>&1 | tail -1
          else
            gh api -X POST "repos/bo-jr/$r/rulesets" --input "$payload" \
              --jq '"created ruleset \(.id)"' 2>&1 | tail -1
          fi
        done

  repos:protect:show:
    desc: "Print the current ruleset on each repo without changing anything."
    cmds:
      - |
        for r in bo-platform bo-deploy bo-service-chart bo-service-kit bo-storefront bo-catalog bo-pricing; do
          n=$(gh api "repos/bo-jr/$r/rulesets" --jq 'length' 2>/dev/null || echo '?')
          printf '%-18s rulesets=%s\n' "$r" "$n"
        done
